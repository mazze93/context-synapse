# ContextSynapse landing page — Cloudflare Worker + static assets.
# Deploy (from site/):  npx wrangler deploy
# First time:           npx wrangler login
#
# The Worker (src/index.js) serves GET /api/release (latest GitHub Release,
# edge-cached) and passes everything else through to public/ via the ASSETS
# binding. CI deploys this on push to main (site/**) and on each release —
# see .github/workflows/deploy-site.yml.
name = "contextsynapse-site"
main = "src/index.js"
compatibility_date = "2026-07-01"

# contextsynapse.mazzeleczzare.com (routes below) is the sole canonical URL.
# Declared explicitly so wrangler stops defaulting these and warning on every
# deploy. Flip workers_dev = true to also serve the *.workers.dev subdomain.
workers_dev = false
preview_urls = false

# Serve the landing page from the custom domain. custom_domain = true makes
# wrangler provision the DNS record + edge cert on the mazzeleczzare.com zone
# (same account as the blog/store). The workers.dev subdomain stays live too.
# Top-level (NOT under [assets]) — TOML scopes keys to the preceding table.
routes = [
  { pattern = "contextsynapse.mazzeleczzare.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
